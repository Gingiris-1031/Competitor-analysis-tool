<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Competitive alternatives map</title>
  <desc id="desc">Direct products, adjacent platforms, vendors, and internal teams all compete to deliver the enterprise buyer's desired outcome.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f08a52"/></marker></defs>
  <rect width="1200" height="700" rx="32" fill="#090909"/>
  <text x="70" y="82" fill="#f6f1eb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Map Alternatives, Not Just Direct Competitors</text>
  <text x="70" y="122" fill="#a6a09a" font-family="Inter,Arial,sans-serif" font-size="18">The buyer compares every credible way to achieve the same outcome.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g fill="#191512" stroke="#8d4f34" stroke-width="2"><rect x="90" y="190" width="300" height="72" rx="18"/><rect x="90" y="282" width="300" height="72" rx="18"/><rect x="90" y="374" width="300" height="72" rx="18"/><rect x="90" y="466" width="300" height="72" rx="18"/></g>
    <g fill="#f3eee8" font-size="21" font-weight="600"><text x="240" y="234" text-anchor="middle">Direct Products</text><text x="240" y="326" text-anchor="middle">Adjacent Platforms</text><text x="240" y="418" text-anchor="middle">Service Vendors</text><text x="240" y="510" text-anchor="middle">Internal Teams</text></g>
    <g fill="none" stroke="#f08a52" stroke-width="3" marker-end="url(#arrow)"><path d="M390 226 C550 226 560 310 720 340"/><path d="M390 318 C550 318 560 330 720 350"/><path d="M390 410 C550 410 560 370 720 360"/><path d="M390 502 C550 502 560 390 720 370"/></g>
    <rect x="740" y="245" width="360" height="230" rx="30" fill="#23170f" stroke="#f08a52" stroke-width="3"/>
    <text x="920" y="310" text-anchor="middle" fill="#f3a473" font-size="16" font-weight="700" letter-spacing="2">TRUE UNIT OF ANALYSIS</text>
    <text x="920" y="365" text-anchor="middle" fill="#f8f3ed" font-size="30" font-weight="700">Enterprise Outcome</text>
    <text x="920" y="408" text-anchor="middle" fill="#c6b9ae" font-size="18">What the buyer needs done</text>
  </g>
</svg>
