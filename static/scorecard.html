<style>
  :root {
    --bg:#0D0D0F; --card:#16161A; --elev:#1C1C21;
    --ink:#F5F1EB; --ink-muted:rgba(245,241,235,0.72); --ink-faint:rgba(245,241,235,0.50);
    --border:rgba(255,255,255,0.06); --border-strong:rgba(255,255,255,0.16);
    --accent:#FB923C; --accent-soft:#FDBA74;
    --green:#4ade80; --yellow:#fbbf24; --red:#f87171;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  .wrap { max-width:820px; margin:0 auto; padding:28px 20px 100px; }
  header.top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:32px; }
  .logo { font-family:"Instrument Serif",Georgia,serif; font-size:22px; color:var(--ink); }
  .logo em { color:var(--accent); font-style:italic; }
  .top-right { display:flex; gap:10px; align-items:center; }
  .lang { font-size:13px; color:var(--ink-faint); }
  h1.hero { font-family:"Instrument Serif",Georgia,serif; font-weight:400;
    font-size:38px; line-height:1.15; margin:0 0 10px; }
  h1.hero em { font-style:italic; color:var(--accent); }
  .sub { color:var(--ink-muted); font-size:15px; line-height:1.7; margin:0 0 28px; max-width:600px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:18px; }
  label { display:block; font-size:13px; color:var(--ink-faint); margin:0 0 6px; }
  .field { margin-bottom:16px; }
  input, select { width:100%; background:var(--elev); border:1px solid var(--border-strong);
    border-radius:9px; padding:11px 13px; color:var(--ink); font-size:14px; font-family:inherit; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint-sm { font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .comp-row { display:grid; grid-template-columns:1fr auto; gap:10px; margin-bottom:8px; }
  .btn { background:var(--accent); color:#1a1205; border:none; border-radius:10px;
    padding:13px 22px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:hover { background:var(--accent-soft); }
  .btn.ghost { background:transparent; color:var(--ink-muted); border:1px solid var(--border-strong); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-sm { padding:8px 12px; font-size:13px; }
  .gauge { display:flex; align-items:center; gap:22px; margin-bottom:8px; }
  .score-num { font-family:"Instrument Serif",Georgia,serif; font-size:72px; line-height:1; }
  .score-den { color:var(--ink-faint); font-size:22px; }
  .score-label { font-size:14px; color:var(--ink-muted); }
  .domain-tag { font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--ink-muted); }
  table.metrics { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
  table.metrics th { text-align:left; font-weight:600; color:var(--ink-faint); font-size:12px;
    padding:8px 10px; border-bottom:1px solid var(--border); }
  table.metrics td { padding:11px 10px; border-bottom:1px solid var(--border); color:var(--ink-muted); }
  .light { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .light.green { background:var(--green); box-shadow:0 0 8px rgba(74,222,128,.5); }
  .light.yellow { background:var(--yellow); box-shadow:0 0 8px rgba(251,191,36,.5); }
  .light.red { background:var(--red); box-shadow:0 0 8px rgba(248,113,113,.5); }
  .metric-val { font-family:"JetBrains Mono",monospace; color:var(--ink); }
  .fixes h2, .metrics-wrap h2 { font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:24px; margin:28px 0 12px; }
  .fix { border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px;
    padding:14px 16px; margin-bottom:12px; background:var(--elev); }
  .fix .msg { font-size:14.5px; line-height:1.7; color:var(--ink); margin-bottom:8px; }
  .fix .hint { font-size:13px; color:var(--ink-muted); line-height:1.6; margin-bottom:10px; }
  .fix .cta-line { font-size:13px; }
  .locked { text-align:center; padding:30px 20px; border:1px dashed var(--border-strong);
    border-radius:12px; background:var(--elev); }
  .locked .lock-title { font-size:17px; color:var(--ink); margin-bottom:6px; }
  .locked .lock-sub { font-size:14px; color:var(--ink-muted); margin-bottom:16px; }
  .share-bar { display:flex; gap:10px; align-items:center; margin-top:22px; flex-wrap:wrap; }
  .msg-err { color:var(--red); font-size:14px; margin-top:10px; }
  .hidden { display:none; }
  @media (max-width:560px) {
    .row3 { grid-template-columns:1fr; } .row2 { grid-template-columns:1fr; }
    h1.hero { font-size:30px; } .score-num { font-size:56px; }
  }
</style>

<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/">Ana<em>look</em></a>
    <div class="top-right">
      <a class="lang" id="lang-toggle" href="/zh/scorecard">中文</a>
      <a class="btn ghost btn-sm" id="home-link" href="/"></a>
    </div>
  </header>

  <!-- FORM VIEW -->
  <section id="form-view">
    <h1 class="hero" data-i18n="hero"></h1>
    <p class="sub" data-i18n="sub"></p>
    <div class="card">
      <div class="field">
        <label data-i18n="domainLabel"></label>
        <input id="domain" placeholder="yourdomain.com" autocomplete="off">
      </div>
      <div class="field">
        <label data-i18n="catLabel"></label>
        <select id="category">
          <option value="pro_c" data-i18n="cat_pro_c"></option>
          <option value="smb" data-i18n="cat_smb"></option>
          <option value="b2b" data-i18n="cat_b2b"></option>
          <option value="default" data-i18n="cat_default"></option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="funnelLabel"></label>
        <div class="row3">
          <div><input id="uv" type="number" min="0"></div>
          <div><input id="signups" type="number" min="0"></div>
          <div><input id="paid" type="number" min="0"></div>
        </div>
        <div class="hint-sm" data-i18n="funnelHint"></div>
      </div>
      <div class="field">
        <label data-i18n="cacLabel"></label>
        <div class="row2">
          <div><input id="cac_signup" type="number" min="0" step="0.01"></div>
          <div><input id="cac_paid" type="number" min="0" step="0.01"></div>
        </div>
      </div>
      <div class="field">
        <label data-i18n="seoLabel"></label>
        <input id="seo_score" type="number" min="0" max="100" placeholder="e.g. 72">
      </div>
      <div class="field">
        <label data-i18n="compLabel"></label>
        <div id="comp-list">
          <div class="comp-row"><input class="comp-domain" placeholder="competitor.com"><button class="btn ghost btn-sm" onclick="removeComp(this)" data-i18n="remove"></button></div>
        </div>
        <button class="btn ghost btn-sm" onclick="addComp()" data-i18n="addComp"></button>
      </div>
      <button class="btn" id="submit-btn" onclick="submitCard()" data-i18n="submit"></button>
      <div id="form-err" class="msg-err hidden"></div>
    </div>
  </section>

  <!-- RESULT VIEW -->
  <section id="result-view" class="hidden">
    <div class="card">
      <div class="domain-tag" id="r-domain"></div>
      <div class="gauge">
        <div><span class="score-num" id="r-score">–</span><span class="score-den">/100</span></div>
        <div>
          <div class="score-label" data-i18n="scoreLabel"></div>
          <div class="score-label" id="r-category"></div>
        </div>
      </div>
      <div class="metrics-wrap">
        <table class="metrics">
          <thead><tr><th data-i18n="th_metric"></th><th data-i18n="th_you"></th><th data-i18n="th_bench"></th><th data-i18n="th_status"></th></tr></thead>
          <tbody id="r-metrics"></tbody>
        </table>
        <div id="r-comp-note" class="hint-sm hidden"></div>
      </div>
    </div>

    <div class="fixes">
      <h2><span data-i18n="fixesTitle"></span> <span style="font-size:14px;color:var(--ink-faint)" data-i18n="fixesSub"></span></h2>
      <div id="r-fixes"></div>
      <div id="r-locked" class="locked hidden">
        <div class="lock-title">🔒 <span id="r-fixcount">0</span> <span data-i18n="lockTitle"></span></div>
        <div class="lock-sub" data-i18n="lockSub"></div>
        <button class="btn" onclick="unlockCard()" data-i18n="unlockBtn"></button>
        <div id="unlock-err" class="msg-err hidden"></div>
      </div>
    </div>

    <div class="share-bar">
      <button class="btn ghost btn-sm" onclick="copyShare()" data-i18n="copy"></button>
      <a class="btn ghost btn-sm" id="again-link" data-i18n="again"></a>
      <span id="copied" class="hint-sm hidden" data-i18n="copied"></span>
    </div>
  </section>
</div>

<script>
window.__LANG__ = "en";
const I18N = {
  en: {
    hero: "What's your growth <em>health score</em>?",
    sub: "Enter your own domain (and up to 3 competitors) to auto-diagnose against industry benchmarks: visitor→signup, signup→paid, CAC and on-site SEO. See the score and red/yellow/green lights free; unlock the per-issue fix plan. v1 takes 3 hand-entered funnel numbers — no GA, 30 seconds.",
    domainLabel: "Your domain *",
    catLabel: "Product category (sets the paid-conversion benchmark)",
    cat_pro_c: "Pro-Consumer (paid conversion 5-8%)", cat_smb: "SMB tool (paid conversion 10-15%)",
    cat_b2b: "Enterprise / sales-led B2B (self-serve reference)", cat_default: "Not sure / generic (pass line 5%)",
    funnelLabel: "Last-30-day funnel (fill at least one)", uv: "Visitors (UV)", signups: "Signups", paid: "Paying",
    funnelHint: "e.g. UV 20000 / signups 1800 / paid 54",
    cacLabel: "Optional: paid acquisition cost (USD)", cacSignup: "Signup CAC (red line $8)", cacPaid: "Paid CAC (red line $50)",
    seoLabel: "Optional: on-site SEO score (0-100; below 85 isn't ready for content)",
    compLabel: "Optional: competitor domains (up to 3)", remove: "Remove", addComp: "+ Add competitor",
    submit: "Get my growth health score →", submitting: "Diagnosing…",
    scoreLabel: "Growth health score",
    th_metric: "Metric", th_you: "You", th_bench: "Benchmark", th_status: "Status",
    grade: {green:"On target", yellow:"Needs work", red:"Leaking"},
    cat: {pro_c:"Pro-Consumer", smb:"SMB tool", b2b:"Enterprise / sales-led", default:"Generic"},
    metricLabel: {paid_conversion:"Signup → Paid", signup_conversion:"Visitor → Signup", cac:"Acquisition cost", seo_onsite:"On-site SEO score"},
    compNote: "Competitor scores: ",
    fixesTitle: "Fix priority", fixesSub: "(ranked closest-to-revenue first)",
    lockTitle: "per-issue fix plans generated", lockSub: "The free layer shows the score and lights only. Unlock to see the concrete fix for each failing metric + the matching methodology skill + service.",
    unlockBtn: "Unlock the fix plan ($79 / 1 credit)",
    copy: "📋 Copy share link", again: "Score another →", copied: "Copied",
    allGood: "🎉 Everything is on target — no leaks.",
    ctaSkill: "→ Install the skill: ", ctaLink: "Have Iris install it into your team",
    needDomain: "Please enter your domain", needInputs: "Fill at least one funnel number (UV / signups / paid) or an SEO score",
    genFail: "Failed to generate", netErr: "Network error, please retry",
    unlockLogin: "Please sign in to unlock", unlockCredits: "Not enough credits — top up first", unlockFail: "Unlock failed",
    home: "← Home"
  },
  zh: {
    hero: "你的增长健康分是<em>多少</em>？",
    sub: "输入自己的官网 + 竞品，对着行业基准线自动诊断：UV→注册、注册→付费、获客成本、SEO 基建。免费看分数和红黄绿灯，付费解锁逐项修复方案。第一版手填三个漏斗数，不接 GA，30 秒出结果。",
    domainLabel: "你的官网域名 *",
    catLabel: "产品品类（决定付费转化基准）",
    cat_pro_c: "专业型 2C（Pro-Consumer，付费转化 5-8%）", cat_smb: "中小企业工具 SMB（付费转化 10-15%）",
    cat_b2b: "企业/销售驱动 B2B（自助漏斗参考）", cat_default: "不确定 / 通用（合格线 5%）",
    funnelLabel: "近 30 天漏斗三个数（至少填一个）", uv: "UV 访客", signups: "注册数", paid: "付费数",
    funnelHint: "例：UV 20000 / 注册 1800 / 付费 54",
    cacLabel: "可选：投流获客成本（USD）", cacSignup: "注册 CAC（红线 $8）", cacPaid: "付费 CAC（红线 $50）",
    seoLabel: "可选：站内 SEO 分（0-100，未过 85 不配铺内容）",
    compLabel: "可选：竞品域名（最多 3 个）", remove: "删除", addComp: "+ 加竞品",
    submit: "生成我的增长健康分 →", submitting: "诊断中…",
    scoreLabel: "增长健康分",
    th_metric: "指标", th_you: "你", th_bench: "行业基准", th_status: "状态",
    grade: {green:"达标", yellow:"待优化", red:"漏水"},
    cat: {pro_c:"专业型 2C", smb:"中小企业工具", b2b:"企业/销售驱动", default:"通用品类"},
    metricLabel: {paid_conversion:"注册 → 付费", signup_conversion:"UV → 注册", cac:"获客成本", seo_onsite:"SEO 站内基建分"},
    compNote: "竞品对照分：",
    fixesTitle: "修复优先级", fixesSub: "（按「离钱近」排序）",
    lockTitle: "个失分项的逐项修复方案已生成", lockSub: "免费层只给分数和红黄绿灯。解锁后看到每个失分项的具体修复动作 + 对应方法论 skill + 服务落点。",
    unlockBtn: "解锁修复方案（$79 / 1 积分）",
    copy: "📋 复制分享链接", again: "再测一个 →", copied: "已复制",
    allGood: "🎉 各项都达标，没有失分项。",
    ctaSkill: "→ 装方法论 skill：", ctaLink: "让 Iris 装进你的团队",
    needDomain: "请填写你的官网域名", needInputs: "至少填一个漏斗数字（UV / 注册 / 付费）或 SEO 分",
    genFail: "生成失败", netErr: "网络错误，请重试",
    unlockLogin: "请先登录再解锁", unlockCredits: "积分不足，请先充值", unlockFail: "解锁失败",
    home: "← 回首页"
  }
};
const T = () => I18N[window.__LANG__] || I18N.en;
const ZH = () => window.__LANG__ === 'zh';
const PAGE_BASE = () => ZH() ? '/zh/scorecard' : '/scorecard';
const $ = id => document.getElementById(id);

function applyI18n(){
  const t = T();
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = t[el.getAttribute('data-i18n')] || ''; });
  $('uv').placeholder=t.uv; $('signups').placeholder=t.signups; $('paid').placeholder=t.paid;
  $('cac_signup').placeholder=t.cacSignup; $('cac_paid').placeholder=t.cacPaid;
  $('home-link').textContent=t.home;
  $('lang-toggle').textContent = ZH() ? 'EN' : '中文';
  $('again-link').href = PAGE_BASE();
}
function wireLangToggle(){
  const seg = location.pathname.split('/').filter(Boolean);
  const last = seg[seg.length-1];
  const hash = (last && last!=='scorecard' && last!=='zh') ? last : null;
  const other = ZH() ? '/scorecard' : '/zh/scorecard';
  $('lang-toggle').href = hash ? other+'/'+hash : other;
}

function addComp() {
  const t=T();
  const row = document.createElement('div');
  row.className = 'comp-row';
  row.innerHTML = `<input class="comp-domain" placeholder="competitor.com"><button class="btn ghost btn-sm" onclick="removeComp(this)">${t.remove}</button>`;
  $('comp-list').appendChild(row);
}
function removeComp(btn){ btn.parentElement.remove(); }
function numOrNull(id){ const v=$(id).value.trim(); return v===''?null:Number(v); }
function pct(v){ return (v*100).toFixed(1)+'%'; }
function fmtVal(m,v){ if(m.key==='paid_conversion'||m.key==='signup_conversion') return pct(v); if(m.key==='cac') return '$'+v; return v; }

async function submitCard(){
  const t=T();
  $('form-err').classList.add('hidden');
  const domain=$('domain').value.trim();
  if(!domain){ showFormErr(t.needDomain); return; }
  const uv=numOrNull('uv'),signups=numOrNull('signups'),paid=numOrNull('paid'),seo=numOrNull('seo_score');
  if(uv===null&&signups===null&&paid===null&&seo===null){ showFormErr(t.needInputs); return; }
  const competitors=[...document.querySelectorAll('.comp-domain')].map(i=>i.value.trim()).filter(Boolean).map(d=>({domain:d}));
  const body={domain,category:$('category').value,uv,signups,paid,cac_signup:numOrNull('cac_signup'),cac_paid:numOrNull('cac_paid'),seo_score:seo,competitors};
  const btn=$('submit-btn'); btn.disabled=true; btn.textContent=t.submitting;
  try{
    const res=await fetch('/api/scorecard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    if(!res.ok){ showFormErr(data.error||t.genFail); btn.disabled=false; btn.textContent=t.submit; return; }
    history.pushState({},'',PAGE_BASE()+'/'+data.hash);
    renderResult(data);
  }catch(e){ showFormErr(t.netErr); btn.disabled=false; btn.textContent=t.submit; }
}
function showFormErr(m){ const e=$('form-err'); e.textContent=m; e.classList.remove('hidden'); }

// 从结构化字段本地化生成失分项文案（不使用后端的中文 message/hint）
function fixMessage(f, byKey){
  const t=T(), m=byKey[f.key]||{}, sev=(f.grade==='red');
  const bp=m.benchmark_pass, bg=m.benchmark_good, cat=t.cat[/* filled at call */ window.__CAT__]||'';
  if(f.key==='paid_conversion') return ZH()
    ? `注册→付费 ${pct(m.value)}，${sev?'严重低于':'略低于'}${cat}合格线 ${pct(bp)}（优秀 ${pct(bg)}）——这是最离钱的漏水点。`
    : `Signup→paid ${pct(m.value)}, ${sev?'well below':'just below'} the ${cat} pass line ${pct(bp)} (great ${pct(bg)}) — the leak closest to revenue.`;
  if(f.key==='signup_conversion') return ZH()
    ? `UV→注册 ${pct(m.value)}，${sev?'严重低于':'略低于'}最低线 ${pct(bp)}（优秀 ${pct(bg)}）。`
    : `Visitor→signup ${pct(m.value)}, ${sev?'well below':'just below'} the floor ${pct(bp)} (great ${pct(bg)}).`;
  if(f.key==='cac') return ZH()
    ? (sev?`获客成本 $${m.value} 已超红线 $${bp}——投流前先修转化。`:`获客成本 $${m.value}，在红线 $${bp} 内但高于优秀线 $${bg}。`)
    : (sev?`CAC $${m.value} is over the $${bp} red line — fix conversion before spending.`:`CAC $${m.value} is within the $${bp} line but above the $${bg} target.`);
  if(f.key==='seo_onsite') return ZH()
    ? `站内 SEO 分 ${m.value}，未达 ${bg} 的「配铺内容」门槛（成熟站基准 ${bp}）。`
    : `On-site SEO ${m.value}, below the ${bg} content-ready threshold (mature-site benchmark ${bp}).`;
  return '';
}
function fixHint(key){
  const H = { en:{
    paid_conversion:"Paid conversion is the leak closest to money: fix pricing/paywall/activation-to-aha before driving traffic.",
    signup_conversion:"Low visitor→signup is usually a landing-page value-prop + hero CTA problem, not a traffic problem.",
    cac:"When CAC is over the red line, cut channels and fix conversion first — don't add budget.",
    seo_onsite:"Publishing content before you pass the 85 on-site threshold is wasted — fix the foundation first."
  }, zh:{
    paid_conversion:"付费转化是最离钱的漏水点：先修定价/付费墙/激活到 aha 的路径，再谈引流。",
    signup_conversion:"UV→注册偏低通常是落地页价值主张 + 首屏 CTA 问题，不是流量问题。",
    cac:"获客成本超红线时先砍渠道、修转化，别加预算。",
    seo_onsite:"站内分未过 85 门槛前铺内容是浪费——先补基建再产内容。"
  }};
  return (H[ZH()?'zh':'en']||{})[key]||'';
}

function renderResult(data){
  const t=T();
  window.__CAT__ = data.category || 'default';
  $('form-view').classList.add('hidden');
  $('result-view').classList.remove('hidden');
  $('r-domain').textContent = data.domain||'';
  $('r-score').textContent = data.overall_score;
  $('r-category').textContent = t.cat[data.category]||'';
  const byKey={}; (data.metrics||[]).forEach(m=>byKey[m.key]=m);

  const tbody=$('r-metrics'); tbody.innerHTML='';
  (data.metrics||[]).forEach(m=>{
    const tr=document.createElement('tr');
    const bench = m.lower_is_better ? `≤ ${fmtVal(m,m.benchmark_pass)}` : `≥ ${fmtVal(m,m.benchmark_pass)}`;
    tr.innerHTML = `<td>${t.metricLabel[m.key]||m.key}</td>
      <td class="metric-val">${fmtVal(m,m.value)}</td>
      <td>${bench}</td>
      <td><span class="light ${m.grade}"></span>${t.grade[m.grade]||''}</td>`;
    tbody.appendChild(tr);
  });

  const comps=data.competitors||[];
  if(comps.length){ const note=$('r-comp-note'); note.classList.remove('hidden');
    note.textContent = t.compNote + comps.map(c=>`${c.domain} ${c.overall_score}/100`).join(' · '); }

  const fixesEl=$('r-fixes'); fixesEl.innerHTML='';
  if(data.fixes_locked){ $('r-locked').classList.remove('hidden'); $('r-fixcount').textContent=data.fix_count||0; }
  else{
    $('r-locked').classList.add('hidden');
    (data.fixes||[]).forEach(f=>{
      const div=document.createElement('div'); div.className='fix';
      let cta='';
      if(f.skill) cta=`<div class="cta-line">${t.ctaSkill}<code>${esc(f.skill)}</code> · <a href="${esc(f.cta||'#')}" target="_blank">${t.ctaLink}</a></div>`;
      const hint=fixHint(f.key);
      div.innerHTML=`<div class="msg"><span class="light ${f.grade}"></span>${esc(fixMessage(f,byKey))}</div>
        ${hint?`<div class="hint">${esc(hint)}</div>`:''}${cta}`;
      fixesEl.appendChild(div);
    });
    if(!(data.fixes||[]).length) fixesEl.innerHTML=`<div class="hint" style="color:var(--green)">${t.allGood}</div>`;
  }
  wireLangToggle();
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function unlockCard(){
  const t=T();
  $('unlock-err').classList.add('hidden');
  const hash=location.pathname.split('/').pop();
  try{
    const res=await fetch('/api/scorecard/'+hash+'/unlock',{method:'POST',headers:{'Content-Type':'application/json'}});
    const data=await res.json();
    if(!res.ok){
      if(res.status===401){ showUnlockErr(t.unlockLogin); return; }
      if(res.status===402){ showUnlockErr(t.unlockCredits); return; }
      showUnlockErr(data.error||t.unlockFail); return;
    }
    renderResult(data);
  }catch(e){ showUnlockErr(t.netErr); }
}
function showUnlockErr(m){ const e=$('unlock-err'); e.textContent=m; e.classList.remove('hidden'); }
function copyShare(){ navigator.clipboard.writeText(location.href).then(()=>{ $('copied').classList.remove('hidden'); setTimeout(()=>$('copied').classList.add('hidden'),1800); }); }

async function boot(){
  document.documentElement.lang = ZH() ? 'zh-CN' : 'en';
  applyI18n(); wireLangToggle();
  const seg=location.pathname.split('/').filter(Boolean);
  const last=seg[seg.length-1];
  const hash=(last && last!=='scorecard' && last!=='zh') ? last : null;
  if(hash){
    try{ const res=await fetch('/api/scorecard/'+hash); const data=await res.json();
      if(res.ok){ renderResult(data); return; } }catch(e){}
  }
  $('form-view').classList.remove('hidden');
}
window.addEventListener('popstate', boot);
boot();
</script>
