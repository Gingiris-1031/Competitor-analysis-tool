name: Weekly user metrics report

# Runs every Monday at 01:07 UTC = Monday 09:07 Asia/Shanghai (Iris's TZ).
# Off-the-:00 minute to avoid the cron stampede.
on:
  schedule:
    - cron: "7 1 * * 1"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the report back into the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/user_metrics.py > /tmp/report.md
          echo "User metrics report generated:"
          echo "─────────────────"
          cat /tmp/report.md
          echo "─────────────────"

      - name: Run attribution report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Non-fatal: a bad attribution run must NOT block the core weekly
        # metrics from committing. Falls back to a placeholder on failure.
        run: |
          python scripts/attribution_report.py > /tmp/attribution.md \
            || echo "⚠️ Attribution report failed — check this step's log." > /tmp/attribution.md
          echo "Attribution report generated:"
          echo "─────────────────"
          cat /tmp/attribution.md
          echo "─────────────────"

      - name: Save report to repo
        run: |
          mkdir -p docs/weekly_metrics
          # Filename: YYYY-Www.md (ISO week)
          WEEK=$(date -u +"%Y-W%V")
          DEST="docs/weekly_metrics/${WEEK}.md"
          # Combine both reports into one weekly file.
          cp /tmp/report.md "$DEST"
          {
            echo ""
            echo "---"
            echo ""
            cat /tmp/attribution.md
          } >> "$DEST"
          echo "Saved to $DEST"

      - name: Commit & push report
        run: |
          git config user.name "analook-bot"
          git config user.email "bot@analook.com"
          git add docs/weekly_metrics/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            WEEK=$(date -u +"%Y-W%V")
            git commit -m "chore(metrics): weekly user report ${WEEK} (auto-generated)"
            git push
          fi

      - name: Step Summary (visible on Actions run page)
        if: always()
        run: |
          echo "## 📊 Analook 周报" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/report.md ]; then
            cat /tmp/report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Metrics script failed — check the 'Run metrics' step above." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/attribution.md ]; then
            cat /tmp/attribution.md >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Attribution report failed — check the 'Run attribution report' step above." >> $GITHUB_STEP_SUMMARY
          fi
